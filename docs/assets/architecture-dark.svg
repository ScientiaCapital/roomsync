<svg xmlns="http://www.w3.org/2000/svg" width="880" height="350" viewBox="0 0 880 350" role="img" aria-label="roomsync reads the video platform through its API and each Epiphan device through Epiphan Edge, saved as JSON, and reports where they disagree. A person approves a dry run before any session is created. Creating sessions comes last." font-family="Söhne,-apple-system,Segoe UI,Helvetica,Arial,sans-serif">
  <defs><marker id="head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 z" fill="#d7daf9"/></marker></defs>
  <rect width="880" height="350" rx="16" fill="#0d231f"/>
  <rect x="30" y="50" width="200" height="60" rx="8" fill="#0c3d34" stroke="#316472"/>
  <text x="130.0" y="74.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#ffffff">Video platform</text>
  <text x="130.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#cfd3dc">Panopto first</text>
  <path d="M230 80 L338 80" stroke="#d7daf9" stroke-width="2" fill="none" marker-end="url(#head)"/>
  <text x="284.0" y="71" text-anchor="middle" font-size="11" fill="#cfd3dc">API reads</text>
  <rect x="340" y="50" width="200" height="60" rx="8" fill="#0c3d34" stroke="#316472"/>
  <text x="440.0" y="74.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#ffffff" font-family="Söhne Mono,ui-monospace,SFMono-Regular,Menlo,monospace">roomsync</text>
  <text x="440.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#cfd3dc">read only, dry run by default</text>
  <path d="M650 80 L542 80" stroke="#d7daf9" stroke-width="2" fill="none" marker-end="url(#head)"/>
  <text x="596.0" y="71" text-anchor="middle" font-size="11" fill="#cfd3dc">saved JSON</text>
  <rect x="650" y="50" width="200" height="60" rx="8" fill="#0c3d34" stroke="#316472"/>
  <text x="750.0" y="74.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#ffffff">Epiphan Edge</text>
  <text x="750.0" y="93.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#cfd3dc">read tools, through Claude Code</text>
  <path d="M440 112 L440 158" stroke="#d7daf9" stroke-width="2" fill="none" marker-end="url(#head)"/>
  <rect x="340" y="160" width="200" height="60" rx="8" fill="#0c3d34" stroke="#316472"/>
  <text x="440.0" y="184.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#ffffff">Drift report</text>
  <text x="440.0" y="203.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#cfd3dc">where the two sides disagree</text>
  <path d="M440 222 L440 268" stroke="#d7daf9" stroke-width="2" fill="none" marker-end="url(#head)"/>
  <rect x="340" y="270" width="200" height="60" rx="8" fill="#0c3d34" stroke="#316472"/>
  <text x="440.0" y="294.0" text-anchor="middle" dominant-baseline="middle" font-size="14" font-weight="600" fill="#ffffff">A person approves</text>
  <text x="440.0" y="313.0" text-anchor="middle" dominant-baseline="middle" font-size="12" fill="#cfd3dc">the room, the time, the effect</text>
  <path d="M338 300 L130 300 L130 114" stroke="#d7daf9" stroke-width="2" stroke-dasharray="5 4" fill="none" marker-end="url(#head)"/>
  <text x="234" y="292" text-anchor="middle" font-size="12" fill="#cfd3dc">Create sessions</text>
  <text x="234" y="321" text-anchor="middle" font-size="11" fill="#cfd3dc">planned, built last</text>
  <circle cx="590" cy="190" r="5" fill="#83ce41"/>
  <text x="602" y="195" font-size="13" fill="#ffffff">Reads need no approval.</text>
  </svg>
